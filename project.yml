name: Spectral
options:
  bundleIdPrefix: com.spectral
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Spectral:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spectral.vocalguide
        PRODUCT_NAME: Spectral
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
